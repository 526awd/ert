name: Daily Scheduled Task

on:
  schedule:
    # cron 格式: 分 时 日 月 周
    # UTC 22:00 等于 北京时间 (UTC+8) 06:00
    - cron: '0 0 * * *'
  # 保留手动触发入口，方便调试与测试
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Execute task
        run: |
          echo "Current runner time (UTC): $(date -u)"
          echo "Current Beijing time: $(TZ='Asia/Shanghai' date)"
          # 在此处添加你的具体执行脚本或命令
          python we.py
          git config --global user.name "526awd"
          git config --global user.email "62787078+526awd@users.noreply.github.com"
          git commit --allow-empty -m "空白信息"
